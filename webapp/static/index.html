<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarWash Cloud — Вход</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/theme-plata.css">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-side">
    <div class="login-mark"><i class="ti ti-droplet"></i></div>
    <h2>CarWash Cloud</h2>
    <p>Касса, машины, зарплаты и отчёты по всем филиалам — в одном месте, в реальном времени.</p>
    <div class="login-foot">5 филиалов · онлайн</div>
  </div>

  <div class="login-card">
    <div class="login-brand-row"><span class="dot"></span><span>Система на связи</span></div>
    <h1>Вход</h1>
    <div class="login-sub">Общий пароль компании + ваше имя и должность</div>

    <label>Пароль</label>
    <input type="password" placeholder="Общий пароль">

    <label>Ваше имя</label>
    <input type="text" placeholder="Например, Иван">

    <label>Должность</label>
    <div class="login-roles">
      <button type="button" class="role-btn" data-role="мойщик" onclick="selectRole(this)">Мойщик</button>
      <button type="button" class="role-btn" data-role="админ" onclick="selectRole(this)">Админ</button>
      <button type="button" class="role-btn" data-role="владелец" onclick="selectRole(this)">Владелец</button>
    </div>

    <div class="login-branch-field" id="branchField">
      <label>Филиал</label>
      <select>
        <option>Мойка на Ленина, 12</option>
        <option>Мойка на Гагарина, 4</option>
        <option>Мойка на Кирова, 55</option>
      </select>
    </div>

    <button class="btn-submit" onclick="window.location.href='dashboard.html'">Войти</button>
    <div class="login-error" id="err">Заполните пароль, имя и выберите должность</div>
  </div>
</div>

<script>
function selectRole(btn) {
  document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("branchField").style.display = btn.dataset.role === "владелец" ? "none" : "block";
}
</script>
</body>
</html>
