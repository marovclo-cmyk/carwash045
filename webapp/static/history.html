<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarWash Cloud — История изменений</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/theme-plata.css">
</head>
<body>
<div class="shell">
  <div class="rail" id="sidebarRoot"></div>

  <div class="main">
    <div class="err-banner" id="errBanner"></div>

    <div class="page-head">
      <div>
        <div class="page-title">История изменений</div>
        <div class="page-sub" id="pageSub">—</div>
      </div>
      <div class="head-actions">
        <button class="btn secondary" id="refreshBtn"><i class="ti ti-refresh"></i>Обновить</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Последние действия</div>
      </div>
      <div id="entriesList"></div>
      <div id="entriesEmpty" class="empty-note" style="display:none">Пока ничего не происходило</div>
    </div>
  </div>
</div>

<script src="/static/site-common.js"></script>
<script>
if (CW.requireAuth()) {
  CW.renderSidebar("history");

  const branch = CW.getActiveBranch();
  const errEl = document.getElementById("errBanner");
  function showErr(msg) { errEl.textContent = msg; errEl.style.display = "block"; }

  const ACTION_META = {
    add:             { icon: "ti-plus",          color: "green",  label: "Добавлена машина" },
    edit:            { icon: "ti-pencil",        color: "accent", label: "Изменена машина" },
    delete:          { icon: "ti-trash",         color: "red",    label: "Удалена машина" },
    status:          { icon: "ti-check",         color: "green",  label: "Изменён статус машины" },
    expense_add:     { icon: "ti-minus",         color: "red",    label: "Добавлен расход" },
    expense_delete:  { icon: "ti-trash",         color: "red",    label: "Удалён расход" },
    income_add:      { icon: "ti-plus",          color: "green",  label: "Добавлен доход" },
    income_delete:   { icon: "ti-trash",         color: "red",    label: "Удалён доход" },
    product_add:     { icon: "ti-shopping-cart", color: "purple", label: "Продан товар" },
    product_delete:  { icon: "ti-trash",         color: "red",    label: "Удалён товар" },
    loyalty_delete:  { icon: "ti-heart",         color: "purple", label: "Удалена скидка" },
    advance_add:     { icon: "ti-cash",          color: "red",    label: "Выдан аванс" },
    advance_delete:  { icon: "ti-trash",         color: "red",    label: "Удалена запись аванса" },
    fixed_rate_set:  { icon: "ti-cash-banknote", color: "orange", label: "Установлена ставка" },
    fixed_rate_clear:{ icon: "ti-cash-banknote", color: "red",    label: "Убрана ставка" },
    newday:          { icon: "ti-calendar-event",color: "orange", label: "Смена закрыта" },
    dayopen:         { icon: "ti-lock-open",      color: "green",  label: "Смена открыта" },
  };

  if (!branch) {
    showErr("Филиал не выбран. Выберите филиал в сайдбаре.");
  } else {
    document.getElementById("pageSub").textContent = `${branch} · последние 100 действий`;
    load();
  }

  document.getElementById("refreshBtn").addEventListener("click", load);

  async function load() {
    errEl.style.display = "none";
    try {
      const data = await CW.authFetch(`/api/history?branch=${encodeURIComponent(branch)}&limit=100`);
      const entries = data.entries || [];
      const list = document.getElementById("entriesList");
      const empty = document.getElementById("entriesEmpty");
      if (!entries.length) {
        list.innerHTML = ""; empty.style.display = "block"; return;
      }
      empty.style.display = "none";
      list.innerHTML = entries.map(e => {
        const meta = ACTION_META[e.action] || { icon: "ti-dots", color: "accent", label: e.action };
        const isWarn = e.action === "newday" && (e.details || "").includes("не сошлась");
        const color = isWarn ? "red" : meta.color;
        return `
          <div class="entry">
            <div class="entry-icon" style="background:var(--${color}-tint);color:var(--${color})"><i class="ti ${meta.icon}"></i></div>
            <div class="entry-body">
              <div class="entry-top">
                <div class="entry-action">${meta.label}</div>
                <div class="entry-time">${e.at || ""}</div>
              </div>
              ${e.details ? `<div class="entry-details">${e.details}</div>` : ""}
              <div class="entry-actor"><i class="ti ti-user" style="font-size:11px;vertical-align:-1px"></i> ${e.actor_name || "—"}</div>
            </div>
          </div>
        `;
      }).join("");
    } catch (e) {
      showErr(e.message);
    }
  }
}
</script>
</body>
</html>
