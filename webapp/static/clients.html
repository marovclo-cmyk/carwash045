<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarWash Cloud — клиенты</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/theme-plata.css">
<style>
  .search-field{ position:relative; margin-bottom:16px; }
  .search-field input{
    width:100%; padding:12px 14px 12px 40px; border-radius:var(--r-sm);
    border:1.5px solid var(--line); background:var(--paper); font-size:14px;
  }
  .search-field input:focus{ outline:none; border-color:var(--orange); }
  .search-field i{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .client-row{ cursor:pointer; }
  .client-row:hover{ background:var(--paper-2); }
  .client-av{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .client-name{ font-size:14px; font-weight:600; }
  .client-sub{ font-size:12px; color:var(--muted); margin-top:1px; }
  .client-right{ text-align:right; }
  .client-total{ font-size:14px; font-weight:700; color:var(--green); }
  .client-visits{ font-size:11px; color:var(--muted); }
  .detail-back{ display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; cursor:pointer; margin-bottom:14px; }
  .detail-back:hover{ color:var(--ink); }
  /* ── СЕГМЕНТЫ (GAP-CRM1, этап 1 — сегментация) ──────────────────────────── */
  .filter-chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; margin-bottom:14px; }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex-shrink:0; background:var(--paper); border-radius:20px;
    padding:7px 14px; font-size:12px; font-weight:500; color:var(--muted);
    white-space:nowrap; cursor:pointer; border:1px solid var(--line); transition:all .1s;
  }
  .filter-chip.active{ background:var(--ink); color:var(--paper); border-color:transparent; font-weight:700; }
</style>
</head>
<body>
<div class="shell">
  <div class="rail" id="sidebarRoot"></div>

  <div class="main">
    <div class="err-banner" id="errBanner"></div>

    <div id="viewList">
      <div class="page-head">
        <div>
          <div class="page-title">Клиенты</div>
          <div class="page-sub" id="pageSub">—</div>
        </div>
        <div class="head-actions">
          <button class="btn secondary" id="refreshBtn"><i class="ti ti-refresh"></i>Обновить</button>
        </div>
      </div>

      <div class="search-field">
        <i class="ti ti-search"></i>
        <input type="text" id="qInput" placeholder="Поиск по телефону или имени">
      </div>

      <div class="filter-chips" id="segmentChips"></div>

      <div class="panel">
        <div id="clientsList"></div>
        <div id="clientsEmpty" class="empty-note" style="display:none">Клиентов пока нет — они появятся сами, как только при добавлении машины укажут телефон</div>
      </div>
    </div>

    <div id="viewDetail" style="display:none">
      <div class="detail-back" id="backBtn"><i class="ti ti-chevron-left"></i>Все клиенты</div>
      <div class="page-head">
        <div>
          <div class="page-title" id="dName">—</div>
          <div class="page-sub" id="dPhone">—</div>
        </div>
        <div class="head-actions">
          <button class="btn secondary" id="editClientBtn"><i class="ti ti-pencil"></i>Редактировать</button>
        </div>
      </div>
      <div id="editClientPanel" class="panel" style="display:none;margin-bottom:16px;padding:16px 20px">
        <div class="field">
          <label>Имя клиента</label>
          <input type="text" id="eName" placeholder="Например, Дарья">
        </div>
        <div class="field">
          <label>Машины (через запятую)</label>
          <input type="text" id="eCars" placeholder="Например, Lexus RX, Camry">
        </div>
        <div id="editClientErr" class="err-banner" style="display:none;margin-bottom:10px"></div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="saveClientBtn">Сохранить</button>
          <button class="btn secondary" id="cancelClientBtn">Отмена</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
        <div class="mini-stat"><div class="ms-label">Визитов</div><div class="ms-value" id="dVisits">0</div></div>
        <div class="mini-stat"><div class="ms-label">Всего потрачено</div><div class="ms-value" id="dTotal" style="color:var(--green)">0</div></div>
        <div class="mini-stat"><div class="ms-label">Последний визит</div><div class="ms-value" id="dLast" style="font-size:13px">—</div></div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <div class="panel-head"><div class="panel-title">Машины</div></div>
        <div id="dCars" style="padding:12px 20px;font-size:13px;color:var(--muted)">—</div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">История визитов</div></div>
        <div id="dVisitsList"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/site-common.js"></script>
<script>
if (CW.requireAuth()) {
  CW.renderSidebar("clients");

  const errEl = document.getElementById("errBanner");
  function showErr(msg) { errEl.textContent = msg; errEl.style.display = "block"; }

  document.getElementById("pageSub").textContent = CW.todayLabel();

  // ── Сегменты (GAP-CRM1, этап 1 — сегментация без рассылок; каналы
  // уведомлений клиенту не решены владельцем, см. GAP-NOTIFY1, поэтому
  // рассылки сюда сознательно не входят). Все сегменты считаются на
  // уже загруженных полях client_summary() (visit_count/total_spent/
  // last_visit/discount_percent) — новых бэкенд-эндпоинтов не потребовалось.
  const SEGMENTS = [
    { id: "all",       label: "Все" },
    { id: "inactive30", label: "Не были 30+ дней" },
    { id: "new",       label: "Новые (1 визит)" },
    { id: "no_visits", label: "Без визитов" },
    { id: "discount",  label: "Постоянная скидка" },
    { id: "top10",     label: "Топ-10 по чеку" },
  ];
  let activeSegment = "all";
  let currentQuery = "";
  const emptyDefaultText = document.getElementById("clientsEmpty").textContent;

  function parseRuDate(s) {
    // "ДД.ММ.ГГГГ" → Date | null — тот же формат, что везде в проекте
    // хранит даты визитов (см. sessions.upsert_client_visit).
    if (!s) return null;
    const parts = s.split(".");
    if (parts.length !== 3) return null;
    const [d, m, y] = parts.map(Number);
    if (!d || !m || !y) return null;
    return new Date(y, m - 1, d);
  }

  function applySegment(clients, segment) {
    switch (segment) {
      case "inactive30": {
        const now = new Date();
        return clients.filter(c => {
          const d = parseRuDate(c.last_visit);
          return d && (now - d) / 86400000 >= 30;
        });
      }
      case "new":
        return clients.filter(c => c.visit_count === 1);
      case "no_visits":
        return clients.filter(c => c.visit_count === 0);
      case "discount":
        return clients.filter(c => c.discount_percent != null);
      case "top10":
        return clients.slice().sort((a, b) => (b.total_spent || 0) - (a.total_spent || 0)).slice(0, 10);
      default:
        return clients;
    }
  }

  function renderSegmentChips() {
    const el = document.getElementById("segmentChips");
    el.innerHTML = SEGMENTS.map(s =>
      `<div class="filter-chip${s.id === activeSegment ? " active" : ""}" data-seg="${s.id}">${s.label}</div>`
    ).join("");
    el.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        activeSegment = chip.dataset.seg;
        renderSegmentChips();
        applyFilters();
      });
    });
  }

  function applyFilters() {
    let list = applySegment(clientsCache, activeSegment);
    if (currentQuery) {
      const qDigits = currentQuery.replace(/\D/g, "");
      list = list.filter(c =>
        (qDigits && c.phone.includes(qDigits)) || (c.name || "").toLowerCase().includes(currentQuery)
      );
    }
    renderList(list);
  }

  renderSegmentChips();

  let clientsCache = [];

  async function loadClients() {
    errEl.style.display = "none";
    try {
      const data = await CW.authFetch("/api/clients");
      clientsCache = data.clients || [];
      applyFilters();
    } catch (e) { showErr(e.message); }
  }

  function avatarColor(name) {
    const colors = ["#FF5000", "#7A5CFF", "#1B8A57", "#D63A2E", "#0D0D0D"];
    let h = 0;
    for (const ch of (name || "?")) h = (h * 31 + ch.charCodeAt(0)) % colors.length;
    return colors[h];
  }
  function initials(name) {
    const parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  function formatPhone(phone) {
    if (phone.length === 11) return `+${phone[0]} ${phone.slice(1, 4)} ${phone.slice(4, 7)}-${phone.slice(7, 9)}-${phone.slice(9, 11)}`;
    return phone;
  }

  function renderList(clients) {
    const list = document.getElementById("clientsList");
    const empty = document.getElementById("clientsEmpty");
    if (!clients.length) {
      list.innerHTML = "";
      empty.textContent = (activeSegment === "all" && !currentQuery)
        ? emptyDefaultText
        : "Никого не найдено — попробуйте другой сегмент или запрос";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.innerHTML = clients.map(c => {
      const col = avatarColor(c.name || c.phone);
      return `
      <div class="worker-row client-row" data-phone="${c.phone}">
        <div class="client-av" style="background:${col}22;color:${col}">${initials(c.name)}</div>
        <div style="flex:1">
          <div class="client-name">${c.name || "Без имени"}</div>
          <div class="client-sub">${formatPhone(c.phone)} · ${(c.cars || []).slice(0, 2).join(", ") || "—"}</div>
        </div>
        <div class="client-right">
          <div class="client-total">${CW.money(c.total_spent)}</div>
          <div class="client-visits">${c.visit_count} визит(ов) · ${c.last_visit || "—"}</div>
        </div>
      </div>`;
    }).join("");
    list.querySelectorAll(".client-row").forEach(el => {
      el.addEventListener("click", () => openDetail(el.dataset.phone));
    });
  }

  document.getElementById("qInput").addEventListener("input", (e) => {
    currentQuery = e.target.value.trim().toLowerCase();
    applyFilters();
  });

  document.getElementById("refreshBtn").addEventListener("click", loadClients);
  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("viewDetail").style.display = "none";
    document.getElementById("viewList").style.display = "block";
  });

  let currentClient = null;

  document.getElementById("editClientBtn").addEventListener("click", () => {
    document.getElementById("eName").value = currentClient?.name || "";
    document.getElementById("eCars").value = (currentClient?.cars || []).join(", ");
    document.getElementById("editClientErr").style.display = "none";
    document.getElementById("editClientPanel").style.display = "block";
  });
  document.getElementById("cancelClientBtn").addEventListener("click", () => {
    document.getElementById("editClientPanel").style.display = "none";
  });
  document.getElementById("saveClientBtn").addEventListener("click", async () => {
    const errEl2 = document.getElementById("editClientErr");
    errEl2.style.display = "none";
    const name = document.getElementById("eName").value.trim();
    const cars = document.getElementById("eCars").value.split(",").map(s => s.trim()).filter(Boolean);
    const btn = document.getElementById("saveClientBtn");
    btn.disabled = true;
    try {
      const updated = await CW.authFetch(`/api/clients/${encodeURIComponent(currentClient.phone)}`, {
        method: "PUT", body: JSON.stringify({ name, cars }),
      });
      currentClient = updated;
      document.getElementById("dName").textContent = updated.name || "Без имени";
      document.getElementById("dCars").textContent = (updated.cars || []).join(", ") || "—";
      document.getElementById("editClientPanel").style.display = "none";
      const idx = clientsCache.findIndex(c => c.phone === updated.phone);
      if (idx !== -1) clientsCache[idx] = { ...clientsCache[idx], name: updated.name, cars: updated.cars };
    } catch (e) {
      errEl2.textContent = e.message;
      errEl2.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });

  async function openDetail(phone) {
    errEl.style.display = "none";
    try {
      const c = await CW.authFetch(`/api/clients/${encodeURIComponent(phone)}`);
      currentClient = c;
      document.getElementById("editClientPanel").style.display = "none";
      document.getElementById("viewList").style.display = "none";
      document.getElementById("viewDetail").style.display = "block";
      document.getElementById("dName").textContent = c.name || "Без имени";
      document.getElementById("dPhone").textContent = formatPhone(c.phone);
      document.getElementById("dVisits").textContent = c.visit_count;
      document.getElementById("dTotal").textContent = CW.money(c.total_spent);
      document.getElementById("dLast").textContent = c.last_visit || "—";
      document.getElementById("dCars").textContent = (c.cars || []).join(", ") || "—";
      const visits = (c.visits || []).slice().reverse();
      document.getElementById("dVisitsList").innerHTML = visits.length ? visits.map(v => `
        <div class="worker-row" style="padding:10px 20px">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600">${v.date} · ${v.branch}</div>
            <div class="client-sub">${v.car || "—"}</div>
          </div>
          <div style="font-size:13px;font-weight:700;color:var(--green)">${CW.money(v.total)}</div>
        </div>`).join("") : `<div class="empty-note">Визитов пока нет</div>`;
    } catch (e) { showErr(e.message); }
  }

  loadClients();
}
</script>
</body>
</html>
